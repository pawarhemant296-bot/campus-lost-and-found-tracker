# Full stack on PostgreSQL, one command:
#   docker compose up --build
#   -> UI + API on http://localhost:4000
#
# For the zero-dependency local setup (SQLite, no Docker) see the README.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lostfound
      POSTGRES_PASSWORD: lostfound
      POSTGRES_DB: lostfound
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lostfound -d lostfound']
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      PUBLIC_URL: http://localhost:4000
      CORS_ORIGIN: http://localhost:4000
      JWT_SECRET: change-me-before-you-deploy
      DB_CLIENT: postgres
      DATABASE_URL: postgres://lostfound:lostfound@db:5432/lostfound
      STORAGE_DRIVER: local
      UPLOAD_DIR: /app/backend/uploads
      AI_SERVICE_ENABLED: 'true'
      AI_SERVICE_URL: http://ai:8000
    ports:
      - '4000:4000'
    volumes:
      - uploads:/app/backend/uploads

  ai:
    build:
      context: ./ai-service
    environment:
      AI_IMAGE_MATCHING: 'true'
    ports:
      - '8000:8000'

volumes:
  db-data:
  uploads:
